[package]
name = "az"
version = "4.9.0"
edition = "2021"
authors = ["Araz Gray"]
description = "A ridiculously fast, lightweight & sane terminal text editor built in Rust. Batteries included."
license = "WTFPL"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
